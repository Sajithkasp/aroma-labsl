<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" src="script.js"></script>
  
  <script>
    (function(){
      function m(a){
        var h=a.getAttribute("href");
        if(!h)return;
        try{
          var u=new URL(h,document.baseURI);
          if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){
            a.target="_blank";
            a.rel="noopener noreferrer";
          }
        }catch(e){}
      }
      function s(){ document.querySelectorAll("a[href]").forEach(m); }
      if(document.readyState!=="loading"){ s(); }else{ document.addEventListener("DOMContentLoaded",s); }
      document.addEventListener("click",function(e){
        var a=e.target&&e.target.closest&&e.target.closest("a[href]");
        if(a){m(a);}
      },true);
    })();
  </script>
